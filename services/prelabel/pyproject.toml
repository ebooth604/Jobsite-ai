[project]
name = "sitewire-prelabel"
version = "0.0.0"
description = "Local YOLO11 detection that proposes labels for a human to correct. Never ground truth."
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
prelabel-server = "prelabel.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prelabel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
